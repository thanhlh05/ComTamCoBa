<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f28c28" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="/assets/icon.png" />
    <link rel="stylesheet" href="style.css" />
    <title>Cơm Tấm Cô Ba</title>
  </head>
  <body>
    <div id="app" class="app-shell" role="application" aria-live="polite">
      <div id="screen-title" class="screen active">
        <div class="title-card">
          <div class="logo">🍚</div>
          <h1>Cơm Tấm Cô Ba</h1>
          <p>Trời ơi sườn cháy rồi!</p>
          <button id="start-button" class="primary-btn" type="button">Chạm để vào</button>
        </div>
      </div>

      <div id="screen-prep" class="screen">
        <header class="topbar prep-hud">
          <span id="prep-hud-day">Ngày 1</span>
          <span id="prep-hud-money">200.000đ</span>
          <span id="prep-hud-star">⭐ 4.0</span>
        </header>

        <div class="prep-header">
          <h2>Chuẩn bị mở quán</h2>
          <div class="tab-bar" role="tablist" aria-label="Các mục chuẩn bị">
            <button id="prep-tab-ingredients" class="tab-btn active" role="tab" aria-selected="true" data-tab="ingredients" type="button">
              🧺 Nguyên liệu
            </button>
            <button id="prep-tab-upgrades" class="tab-btn" role="tab" aria-selected="false" data-tab="upgrades" type="button">
              ⭐ Nâng cấp
            </button>
          </div>
        </div>

        <div id="prep-content" class="prep-content-list" role="tabpanel"></div>

        <footer class="prep-footer">
          <button id="btn-open-service" class="primary-btn" type="button">🔥 Mở bán</button>
        </footer>
      </div>

      <div id="screen-service" class="screen">
        <header class="topbar service-hud">
          <span id="service-hud-day">Ngày 1</span>
          <span id="service-hud-money">200.000đ</span>
          <span id="service-hud-timer">120s</span>
          <span id="service-hud-star">⭐ 4.0</span>
        </header>

        <div id="service-toast" class="service-toast hidden" role="status" aria-live="polite"></div>

        <div id="customer-row" class="customer-row" aria-label="Hàng đợi khách"></div>

        <div class="grill-section">
          <div class="grill-header">
            <h3>🔥 Vỉ nướng</h3>
            <span class="grill-sub">Chạm ô nướng, chạm sườn chín gắp vào khay</span>
          </div>
          <div id="grill-grid" class="grill-grid"></div>
          <div class="tray-mini">
            <span>Khay sườn: <strong id="tray-count">0</strong> miếng</span>
            <div id="tray-items" class="tray-items">
              <span class="tray-empty">Chưa có sườn chín</span>
            </div>
          </div>
        </div>

        <div class="plate-section">
          <div class="plate-info">
            <span class="plate-title">Đĩa đang làm:</span>
            <div id="plate-items" class="plate-items">
              <span class="plate-empty">Đĩa trống</span>
            </div>
          </div>
          <div class="ing-buttons" id="ing-buttons">
            <button class="ing-btn" data-ing="com" type="button">🍚 Cơm</button>
            <button class="ing-btn" data-ing="suon" type="button">🍖 Sườn (<span id="tray-btn-count">0</span>)</button>
            <button class="ing-btn" data-ing="bi" type="button">🥓 Bì</button>
            <button class="ing-btn" data-ing="trung" type="button">🍳 Trứng</button>
            <button class="ing-btn" data-ing="tra" type="button">🧊 Trà</button>
            <button id="btn-ing-cha" class="ing-btn hidden" data-ing="cha" type="button">🥮 Chả</button>
            <button id="btn-ing-canh" class="ing-btn hidden" data-ing="canh" type="button">🍲 Canh</button>
          </div>
        </div>

        <div class="service-actions">
          <button id="btn-trash-plate" class="danger-btn" type="button">🗑 Đổ đĩa</button>
          <button id="btn-deliver-plate" class="deliver-btn" type="button">🚀 Giao đĩa</button>
        </div>

        <footer class="service-footer">
          <button id="btn-service-back" class="secondary-btn" type="button" data-target="prep">⬅ Về chuẩn bị</button>
          <button id="btn-service-summary" class="secondary-btn" type="button" data-target="summary">Tổng kết</button>
        </footer>
      </div>

      <section id="screen-summary" class="screen">
            <header class="topbar">
                <span id="summary-hud-day">Ngày 1</span>
                <span>Đã xong</span>
            </header>
            <h1 style="text-align:center;margin:8px 0 4px;font-size:1.5rem;">Tổng kết</h1>
            <div id="summary-content" class="summary-content">
                <!-- JS render vào đây -->
            </div>
        </section>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
