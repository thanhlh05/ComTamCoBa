<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f28c28" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="/assets/icon.png" />
    <link rel="stylesheet" href="style.css" />
    <title>Cơm Tấm Cô Ba</title>
  </head>
  <body>
    <div id="app" class="app-shell" role="application" aria-live="polite">
      <div id="screen-title" class="screen active">
        <div class="title-card">
          <div class="logo">🍚</div>
          <h1>Cơm Tấm Cô Ba</h1>
          <p>Trời ơi sườn cháy rồi!</p>
          <button id="start-button" class="primary-btn" type="button">Chạm để vào</button>
        </div>
      </div>

      <div id="screen-prep" class="screen">
        <div class="topbar">
          <span>Ngày 1</span>
          <span>200.000đ</span>
          <span>⭐ 4.0</span>
        </div>
        <h2>Chuẩn bị</h2>
        <div class="panel">
          <p>Screen chuẩn bị</p>
          <button class="primary-btn" data-target="service">Mở bán</button>
        </div>
      </div>

      <div id="screen-service" class="screen">
        <div class="topbar">
          <span>Ngày 1</span>
          <span>120s</span>
          <span>⭐ 4.0</span>
        </div>
        <h2>Bán hàng</h2>
        <div class="panel">
          <p>Screen bán hàng</p>
          <button class="primary-btn" data-target="summary">Tổng kết</button>
        </div>
      </div>

      <div id="screen-summary" class="screen">
        <div class="topbar">
          <span>Ngày 1</span>
          <span>Đã xong</span>
        </div>
        <h2>Tổng kết</h2>
        <div class="panel">
          <p>Screen tổng kết</p>
          <button class="primary-btn" data-target="prep">Qua ngày mới</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
